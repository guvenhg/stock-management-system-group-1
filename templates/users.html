{% extends "base.html" %}
{% block content %}
<div class="head">
  <h1>Users</h1>
  <a class="button" href="{{ url_for('user_new') }}">New user</a>
</div>
<table>
  <thead>
    <tr><th>Username</th><th>Full name</th><th>Role</th><th></th></tr>
  </thead>
  <tbody>
    {% for row in rows %}
    <tr>
      <td>{{ row.username }}</td>
      <td>{{ row.full_name }}</td>
      <td>{{ row.role }}</td>
      <td class="actions">
        <a href="{{ url_for('user_edit', user_id=row.user_id) }}">Edit</a>
        <form method="post" action="{{ url_for('user_delete', user_id=row.user_id) }}"
              onsubmit="return confirm('Delete this user?')">
          <button type="submit" class="link danger">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
